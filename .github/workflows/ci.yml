name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install circom (prebuilt binary)
        run: |
          curl -sL "https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64" -o /usr/local/bin/circom
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Install dependencies
        run: npm ci

      - name: Compile circuit
        run: |
          mkdir -p build
          circom circuits/sig_verify.circom --r1cs --wasm --sym -o build

      - name: Run completeness & soundness tests
        run: npx mocha test/completeness_soundness.test.js --timeout 120000
