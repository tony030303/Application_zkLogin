name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install circom (prebuilt binary)
        run: |
          curl -sL "https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64" -o /usr/local/bin/circom
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Install dependencies
        run: npm ci

      - name: Compile circuit
        run: |
          mkdir -p build
          circom circuits/sig_verify.circom --r1cs --wasm --sym -o build

      - name: Run completeness & soundness tests
        run: npx mocha test/completeness_soundness.test.js --timeout 120000

      # Full Groth16 setup/prove/verify + benchmark is intentionally NOT run
      # on every push (the trusted setup ceremony is slow and only needs to
      # be regenerated when the circuit changes). It can be triggered
      # manually via workflow_dispatch below.

  full-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install circom
        run: |
          curl -sL "https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64" -o /usr/local/bin/circom
          chmod +x /usr/local/bin/circom
      - name: Install dependencies
        run: npm ci
      - name: Full setup + prove + verify + benchmark
        run: |
          bash scripts/setup.sh
          bash scripts/prove.sh
          bash scripts/verify.sh
          node scripts/benchmark.js 5
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            build/benchmark_results.csv
            build/benchmark_meta.json
